[project]
name = "moodengine"
dynamic = ["version"]
description = "Music mood embedding, clustering & zero-shot labeling engine (MERT + CLAP)"
readme = "README.md"
requires-python = ">=3.11"
# PolyForm Noncommercial 1.0.0 plus a commercial-use exception for the author:
# a composite license, so point at the file rather than an SPDX string.
license = { file = "LICENSE" }
authors = [{ name = "Aymeric Pasco" }]
keywords = ["music", "mood", "embeddings", "MERT", "CLAP", "clustering", "MIR", "zero-shot"]

# Core stays lightweight: clustering / labeling / search / eval / viz on already
# computed embeddings, plus the full test suite — no deep-learning backbones.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "librosa>=0.10.2.post1",      # older floors import pkg_resources (dead without setuptools); adds numpy 2 support
    "umap-learn>=0.5.6",          # older floors crash at import under modern numba; 0.5.6 adds numpy 2 support
    "hdbscan>=0.8.39",            # oldest numpy 2-compatible build with cross-platform wheels (cp38-cp312)
    "scipy>=1.15",                # explicit for cluster_hierarchy; <1.15 fcluster(maxclust) miscuts (returns fewer groups than asked)
    "plotly>=5.18",
    "pyarrow>=14.0",
    "platformdirs>=3.0",          # OS-appropriate default cache dir (never write inside site-packages)
]

[project.optional-dependencies]
# Heavy embedders: install to actually embed audio with MERT / CLAP.
#   pip install "moodengine[models]"   (pulls torch ~ several GB)
models = [
    # 2.13.0 is the first release outside the torch.jit.script memory-corruption
    # advisory (GHSA-rrmf-rvhw-rf47), whose affected range is "<= 2.12.1" — i.e. every
    # earlier release. moodengine never calls torch.jit, so the flaw is unreachable
    # through this library, but a floor is the only way to stop a consumer resolving
    # onto a flagged build; a cap would remediate nothing. Supersedes the previous
    # ">= 2.4, floor set by transformers 5.x" bound, which stays satisfied.
    "torch>=2.13.0",
    "torchaudio>=2.4",            # versioned independently of torch; declares no torch bound
    "torchvision>=0.28",          # required by laion-clap (FrozenBatchNorm2d); 0.28 pins torch == 2.13
    # 5.3.0 is the first release fixing the config-injection RCE (CVE-2026-4372);
    # every < 5.3.0 pin stays flagged, so a version bump (not a downward cap) is
    # the only remediation. Verified compatible with MERT's pinned remote code and
    # laion-clap 1.1.5 — both import only transformers symbols that survive the
    # v4 -> v5 refactor. The former "< 5 / MERT targets 4.x" cap no longer holds.
    "transformers>=5.3.0",
    "laion-clap>=1.1.4",
    "nnAudio>=0.3",               # MERT remote-code feature extractor dependency
    "huggingface_hub>=1.0",       # imported directly (CLAP checkpoint); transformers 5.x needs hub >= 1.0
]
# Optimal-transport journey morph (moodengine.journey.ot_morph). Opt-in — the SLERP journey works
# without it. POT ships cross-platform wheels (macOS arm64 / Windows / Linux).
#   pip install "moodengine[ot]"
ot = [
    "pot>=0.9",
]
# Leiden community detection (moodengine.cluster.cluster_leiden). Opt-in — kmeans/hdbscan/
# spherical work without it; cluster_leiden raises a clear error when absent. Wheels cross-OS cp311+.
#   pip install "moodengine[cluster-graph]"
cluster-graph = [
    "leidenalg>=0.10",
    "python-igraph>=0.11",
]
# PaCMAP 2-D projection (Config.projection_method="pacmap"). Opt-in — umap/densmap work without it.
#   pip install "moodengine[pacmap]"
pacmap = [
    "pacmap>=0.7.3",
]
# TreeSHAP attributions (moodengine.explain, backend="treeshap"). Opt-in — the exact
# dependency-free Shapley backend works without it.
#   pip install "moodengine[explain]"
explain = [
    "shap>=0.46",                 # first release with numpy 2-compatible wheels
]
# MuQ-MuLan backbone (embedder name "mulan") — an ALTERNATIVE audio-text model to CLAP, not a
# replacement. Opt-in: needs [models] as well (it is a torch model), and pulls x-clip -> torchvision.
# The muq distribution ships an sdist only and declares every dependency unpinned, so the floors
# that actually hold come from [models]. Weights are CC-BY-NC-4.0 (the code is MIT).
#   pip install "moodengine[models,muq] @ git+https://github.com/moodengine/moodengine"
muq = [
    "muq>=0.1.0",
]
[project.urls]
Homepage = "https://github.com/moodengine/moodengine"
Repository = "https://github.com/moodengine/moodengine"
Issues = "https://github.com/moodengine/moodengine/issues"
Changelog = "https://github.com/moodengine/moodengine/releases"

[tool.uv]
# Lock-time constraints only (never land in consumers' metadata). Two kinds live here:
# resolver steering, and security floors on packages we never declare ourselves —
# for a transitive dependency there is no requirement of ours to raise, so a
# constraint is the only place to say "never resolve onto a flagged build".
constraint-dependencies = [
    # pynndescent < 0.6 predates numpy 2 and drags an unbuildable llvmlite 0.36 —
    # the resolver otherwise picks that fork when maximizing the numpy version.
    "pynndescent>=0.6",
    # Reaches the lock through [models]: laion-clap -> wandb -> gitpython. 3.1.58 is
    # the first release clear of the whole 2026 run of config-injection and
    # submodule-path-traversal advisories (GHSA-jm78-9fvv-mhgr, GHSA-hmq2-w58f-27jc
    # and siblings), each of which patched only the release before the next landed.
    "gitpython>=3.1.58",
    # Reaches the lock through [models]: torch -> setuptools. 83.0.0 fixes the
    # MANIFEST.in exclusion bypass on macOS (GHSA-h35f-9h28-mq5c), where a NFC rule
    # silently fails to exclude a NFD filename from a built sdist.
    "setuptools>=83.0.0",
]

# `models` and `torch-cpu` resolve the SAME torch release from different indexes, so they
# are declared incompatible and uv forks the resolution. The published extra keeps coming
# from PyPI exactly as before (the CUDA build on linux); the CI-only group takes the CPU
# build. Without the fork one source would win for both, and `uv sync --extra models`
# would silently stop installing a CUDA torch for every linux consumer.
conflicts = [[{ extra = "models" }, { group = "torch-cpu" }]]

# `explicit = true`: consulted ONLY for packages that name it in [tool.uv.sources], so
# nothing else in the tree can be resolved from it by accident.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", group = "torch-cpu" }]

# Dev-only tooling (PEP 735): installed by `uv sync` (uv includes the "dev"
# group by default), never published as an extra, never in consumers' trees.
[dependency-groups]
dev = [
    "pytest>=7.4",
    "pytest-mock>=3.12",          # mocking
    "assertpy>=1.1",              # fluent assertions
    "ruff>=0.15",                 # format + lint (single tool)
    "mypy>=1.14",                 # static types, default mode (staged-strictness plan)
    "deptry>=0.20",               # declared-vs-imported dependency hygiene
    "typer>=0.15",                # scripts/ CLI walkthroughs
    "soundfile>=0.12",            # tests write WAV fixtures directly (the package decodes via librosa)
    "pytest-benchmark>=4.0",      # opt-in hot-path benchmarks (tests/benchmarks, -m benchmark)
    "pytest-cov>=5.0",            # coverage gate (see [tool.coverage] + CI static job)
]

# CI-only, and deliberately NOT an extra: extras are published metadata, groups are not,
# so this never reaches a consumer's tree. It exists so the `test-extras` job can run the
# torch-guarded tests in test_sequence/test_adapt_* — which no CI job executed before —
# without paying for the [models] backbones (on linux, ~2.3 GB of nvidia-* wheels).
# Floor kept in step with [models] `torch`, same GHSA-rrmf-rvhw-rf47 rationale: bump both.
torch-cpu = [
    "torch>=2.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single source of truth for the version: src/moodengine/__init__.py::__version__.
[tool.hatch.version]
path = "src/moodengine/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/moodengine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Real-model tests and benchmarks are opt-in: `-m model` / `-m benchmark`.
addopts = "-q -m 'not model and not benchmark' --import-mode=importlib"
markers = [
    "model: requires the real torch models (MERT/CLAP); deselected by default",
    "benchmark: hot-path performance benchmarks (pytest-benchmark); deselected by default",
]
# No blanket DeprecationWarning/FutureWarning ignores: a deprecation aimed at
# OUR code must stay visible in dev. Only known third-party noise is silenced,
# each entry with its reason.
filterwarnings = [
    # librosa's audioread fallback fires on the corrupt-file tests — that IS the
    # code path under test, not a problem to fix.
    "ignore:PySoundFile failed. Trying audioread instead.:UserWarning",
    "ignore:librosa.core.audio.__audioread_load:FutureWarning",
    # audioread ships aifc/sunau shims for the py3.13 stdlib removals.
    "ignore:aifc was removed:DeprecationWarning",
    "ignore:sunau was removed:DeprecationWarning",
    # Seeded UMAP always forces n_jobs=1 — determinism is the point of the seed.
    "ignore:n_jobs value 1 overridden to 1 by setting random_state:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# src layout: classify `import moodengine` as first-party (isort-style rules).
src = ["src", "tests", "scripts"]

[tool.mypy]
files = ["src/moodengine"]
python_version = "3.11"

# The scientific stack is largely untyped or stub-less; silence only the import
# errors, never the checks on our own code.
[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "umap.*",
    "hdbscan.*",
    "librosa.*",
    "soundfile",
    "plotly.*",
    "pacmap",
    "shap",
    "leidenalg",
    "igraph",
    "laion_clap",
    "transformers",
    "nnAudio.*",
    "ot",
    "pandas",
    "pyarrow",
    "scipy.*",
    "torch",
    "torch.*",
    "huggingface_hub",
    "muq",
]
ignore_missing_imports = true

[tool.deptry]
# plans/ and outputs are not code; tests are covered by the dev group mapping.
extend_exclude = ["plans", "outputs"]
# src layout: the package no longer sits at the repo root, so deptry can't
# auto-detect it as first-party.
known_first_party = ["moodengine"]

[tool.deptry.package_module_name_map]
nnAudio = "nnAudio"
laion-clap = "laion_clap"
python-igraph = "igraph"
pot = "ot"
shap = "shap"

[tool.deptry.per_rule_ignores]
# Declared-but-never-imported, on purpose:
#   pyarrow  — pandas' parquet engine, loaded by pandas at to_parquet() time
#   torch* — imported by laion-clap, which doesn't declare them (packaging gap upstream)
#   nnAudio  — imported by MERT's remote code, not by ours
DEP002 = ["pyarrow", "torchaudio", "torchvision", "nnAudio"]
# typer is dev-group on purpose: scripts/ are developer walkthroughs, not package code.
DEP004 = ["typer"]

[tool.coverage.run]
source = ["moodengine"]
# clap.py / mert.py / mulan.py are pure torch wrappers with no unit tests by contract
# (they run only under the opt-in `-m model` suite) — counting their guaranteed-0% lines
# in the default-suite denominator would make the floor dishonest, not stricter.
omit = ["*/embeddings/clap.py", "*/embeddings/mert.py", "*/embeddings/mulan.py"]

# The `sonarqube` job merges the light and extras+torch data files. Each job records the
# checkout-absolute path of the editable install, and both `coverage combine` and the
# reporting step re-map through this table — so the merge lines up by construction rather
# than by both jobs happening to run under the same $GITHUB_WORKSPACE. Getting this wrong
# is silent: `coverage xml` then emits absolute filenames Sonar cannot map to
# `sonar.sources`, and the project reports 0% over a green build.
[tool.coverage.paths]
source = ["src/moodengine", "*/src/moodengine"]

[tool.coverage.report]
show_missing = true
# Regression floor for the torch-free default suite, set below the value it actually
# reaches so it catches real drops without tripping on normal churn — NOT an aspiration.
# The torch/POT-gated paths in adapt/sequence/journey are covered by the extras+torch
# CI job, whose data is merged with this one into the report Sonar imports — so the
# project number is the union, while this floor stays a floor on the torch-free suite
# alone. Raise it only when a measured, sustained gain backs it.
fail_under = 80
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "if __name__ == .__main__.:",
]
