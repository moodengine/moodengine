# SonarQube Cloud analysis configuration.
#
# CI-based analysis, NOT Automatic Analysis. The two are mutually exclusive, and
# only a scanner run can import a coverage report — Automatic Analysis had been
# scanning this project with no coverage signal at all. `[tool.coverage.report]
# fail_under` already gates coverage locally and in CI; this makes Sonar see the
# same number instead of guessing.
#
# Everything below is version-controlled on purpose. The organization's plan does
# not allow binding a custom Quality Profile to a project, so rule tuning lives
# here, in the repo, where a reader can see it and a PR can change it — rather
# than in a web UI nobody but the maintainer can read.

sonar.projectKey=moodengine_moodengine
sonar.organization=moodengine
sonar.sourceEncoding=UTF-8

# Production code and test code declared separately: Sonar then applies its
# test-specific rules to `tests/`, and keeps test files out of both the coverage
# denominator and the duplication metric. Declaring neither — the Automatic
# Analysis default — counted `tests/` as production source.
sonar.sources=src,scripts
sonar.tests=tests

# The full supported range, matching `requires-python`. Sonar raises a rule only
# when it holds for EVERY listed version, so naming 3.11 here is what stops it
# proposing 3.12+ syntax the floor cannot use.
sonar.python.version=3.11,3.12,3.13,3.14

# Written by the `sonarqube` CI job itself, which merges the data files from the
# `coverage` job (light install) and the `test-extras` job (optional backends + CPU
# torch). Neither alone is the truth: the light suite cannot reach a torch- or
# backend-gated line, and the extras job cannot reach the handful of statements that
# exist only for a MISSING backend. Paths inside are repo-relative, so they line up
# with `sonar.sources` without rewriting.
sonar.python.coverage.reportPaths=coverage.xml

# Mirrors `[tool.coverage.run] omit` in pyproject, plus the CLI wrappers that
# `[tool.coverage.run] source` never measured. Files a coverage run deliberately
# skips are absent from the report entirely, and Sonar reads absent as 0% — so
# without this the project figure would report a hole the suite did not leave.
# Keep this list and the pyproject `omit` list in step.
sonar.coverage.exclusions=src/moodengine/embeddings/clap.py,src/moodengine/embeddings/mert.py,src/moodengine/embeddings/mulan.py,scripts/**

# python:S117 asks locals to be snake_case. The engine is sklearn-style: `X` is
# the embedding matrix, `Xn` its L2-normalized form, `X_valid` the filtered
# subset, `Xtr`/`Ytr` a train split. That is 49 findings over 25 distinct names,
# every one the linear-algebra convention rather than a slip, and no ruff rule
# covers naming here to make the check redundant. Scoped to the engine only: the
# rule stays ACTIVE on `tests/` and `scripts/`, which follow no such convention,
# so a genuine camelCase local is still reported.
sonar.issue.ignore.multicriteria=matrixnames
sonar.issue.ignore.multicriteria.matrixnames.ruleKey=python:S117
sonar.issue.ignore.multicriteria.matrixnames.resourceKey=src/moodengine/**/*.py
