name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# uv itself is pinned, like every action is. Given no version, setup-uv fetches a manifest from
# raw.githubusercontent.com on EVERY job to discover "latest": an unpinned network call per job,
# and the thing that took a whole run down with a bare "fetch failed" in the coverage job. An
# EXACT version skips that resolution entirely — and it is also what makes the download verified,
# because setup-uv falls back to the checksum table baked into the action, and for a version that
# table does not know it SKIPS VALIDATION SILENTLY rather than failing. So the version must be one
# the pinned action knows: 0.11.27 is the newest in v8.3.1's table. Bump this and the setup-uv SHA
# together, or the pin quietly stops being verified.
env:
  UV_VERSION: "0.11.27"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install (light + dev group, locked)
        run: uv sync --locked

      # The default suite is the torch-free contract: it must pass on a light
      # install with no optional extras.
      - name: Tests (light install)
        run: uv run pytest

      - name: Build sdist + wheel
        run: uv build

  # Environment-independent gates, paid once instead of per matrix leg.
  static:
    name: format · lint · types · dependency hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install (locked)
        run: uv sync --locked

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Types (mypy, default mode)
        run: uv run mypy

      - name: Dependency hygiene (deptry)
        run: uv run deptry .

      # Comments must be self-contained for external readers: no references to
      # internal planning documents in any comment or docstring.
      - name: No internal-doc references in comments
        shell: bash
        run: |
          if grep -rInE "R&D|master-plan|plans/|Family-[0-9]|spec[ -][0-9]+" \
              src/ scripts/ tests/ --include="*.py"; then
            echo "::error::internal-doc references found in comments (see matches above)"
            exit 1
          fi

      # Tests assert through assertpy (assert_that), not the bare `assert`
      # statement. `assert_that(...)` and `np.testing.assert_*` do not match this
      # pattern, so it flags only the native statement form.
      - name: No native asserts in tests
        shell: bash
        run: |
          if grep -rInE "^[[:space:]]*assert " tests/ --include="*.py"; then
            echo "::error::native assert statements found in tests — use assertpy assert_that(...)"
            exit 1
          fi

  # Coverage floor for the torch-free default suite (one platform: the light suite
  # runs the same lines everywhere, so a matrix would just re-measure the same number).
  coverage:
    name: coverage (default suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install (light + dev group, locked)
        run: uv sync --locked

      # fail_under lives in pyproject ([tool.coverage.report]); --cov with no path
      # uses [tool.coverage.run] source/omit. This job is the ONLY place the floor is
      # enforced, and deliberately so: it is a floor on the TORCH-FREE contract, which
      # the merged number the `sonarqube` job reports would dilute into meaninglessness.
      - name: Tests with coverage floor
        env:
          COVERAGE_FILE: coverage-data-light
        run: uv run pytest --cov --cov-report=term-missing

      # Raw coverage DATA, not a report: `sonarqube` merges it with the extras+torch
      # job's data before writing the single XML Sonar imports. No leading dot on the
      # filename on purpose — upload-artifact skips hidden files unless told otherwise,
      # and the reported number is exactly the thing that must not shrink silently.
      - name: Upload coverage data (light suite)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-light
          path: coverage-data-light
          if-no-files-found: error

  # SonarQube Cloud. Automatic Analysis is switched OFF for this project: the two
  # modes are mutually exclusive and only a scanner run can import coverage, which
  # left the hosted analysis reporting no coverage at all. Analysis settings live
  # in `sonar-project.properties` at the repo root, not in the web UI.
  sonarqube:
    name: SonarQube Cloud
    needs: [coverage, test-extras]
    # SONAR_TOKEN is not exposed to pull requests from forks, so analysis is
    # skipped there instead of failing on a missing secret. `CI success` tolerates
    # a skipped job, and the push-to-main analysis covers the code once merged.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history, not the default shallow clone: Sonar attributes every
          # issue to a commit via git blame, and the new-code period is "previous
          # version", which it resolves from the release tags.
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The light install carries pytest-cov -> coverage at the LOCKED version, i.e. the
      # exact version that wrote both data files. Coverage data files are schema-
      # versioned, so pinning a second copy by hand here would drift out of step with
      # the lock the moment coverage is bumped.
      - name: Install (locked)
        run: uv sync --locked

      - name: Download coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-data-*
          merge-multiple: true

      # Sonar must see what CI genuinely exercises. The light job alone leaves every
      # torch- and extra-gated path reading 0%, which is a measurement artefact and not
      # a coverage hole. The merge runs in both directions: a handful of statements in
      # pipeline/config/cluster are reachable ONLY when a backend is absent, so the
      # light job is not redundant either. Inputs are named rather than auto-discovered
      # from a directory, so a broken upload fails this step instead of quietly lowering
      # the reported number. --fail-under=0: the floor gates the light suite in the
      # `coverage` job, and applying it to the merged number would assert nothing.
      - name: Merge coverage data into one report
        run: |
          uv run coverage combine coverage-data-light coverage-data-extras
          uv run coverage xml -o coverage.xml --fail-under=0

      # The new-code period is "previous version", so an analysis that reports no
      # version has no baseline to diff against and the gate silently grades
      # nothing. `__version__` is the single source of truth (release-please bumps
      # it in place), read here rather than installed to keep the job import-free.
      - name: Resolve project version
        id: version
        shell: bash
        run: |
          v="$(sed -nE 's/^__version__ *= *"([^"]+)".*/\1/p' src/moodengine/__init__.py)"
          if [ -z "$v" ]; then
            echo "::error::could not read __version__ from src/moodengine/__init__.py"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Analyze
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          # qualitygate.wait blocks on a red gate rather than reporting green and
          # leaving the verdict to be discovered in the web UI — without it this job
          # passes over a failing gate, which makes it a report, not a gate.
          args: >-
            -Dsonar.projectVersion=${{ steps.version.outputs.version }}
            -Dsonar.qualitygate.wait=true

  # Keeps the declared lower bounds honest: resolve every direct dependency to
  # its minimum version and run the suite against that.
  #
  # The 3.11 pin below is load-bearing, not a leftover default. `uv lock` resolves
  # for the whole requires-python range at once, so lowest-direct selects the same
  # floors whatever interpreter runs it — pandas 2.0.0, scikit-learn 1.3.0,
  # hdbscan 0.8.39, pyarrow 14.0.0. Those releases predate cp312+ wheels yet declare
  # an open-ended requires-python (or none), so from 3.12 up the resolver accepts
  # them and falls back to a source build that dies on the pkg_resources modern
  # setuptools no longer ships. Moving this job to a newer Python therefore tests
  # nothing extra, it only fails — and "fixing" that by raising the floors would drop
  # support we actually have. Ordinary (highest) resolution is unaffected on every
  # supported Python: it picks wheel-bearing releases by itself.
  test-lowest:
    name: test · lowest direct resolution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The committed lock must go first: `uv lock` preserves already-locked
      # versions, so resolving on top of it would silently test the pinned
      # (recent) versions instead of the declared minimums.
      - name: Re-lock at lowest direct versions
        run: |
          rm uv.lock
          uv lock --resolution lowest-direct

      # --frozen everywhere below: a plain sync/run may re-lock at the default
      # (highest) resolution and silently un-test the minimums.
      - name: Install
        run: uv sync --frozen

      - name: Tests
        run: uv run --frozen --no-sync pytest

  test-extras:
    # Python 3.13, not 3.14: POT publishes wheels up to cp313 only. torch ships cp313
    # CPU wheels, so the same pin costs nothing for the torch half of this job.
    name: test · extras [ot, cluster-graph, pacmap, explain] + torch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # `--group torch-cpu` is a CPU-only torch, NOT `--extra models`, which would also
      # drag in transformers/laion-clap and, on linux, ~2.3 GB of nvidia-* wheels — the
      # very cost that keeps the real-model suite out of this workflow. adapt.py and
      # sequence.py import nothing beyond torch.nn/optim/functional, so plain torch un-skips
      # all of it. Without this the torch-guarded tests in test_sequence and test_adapt_*
      # importorskip on every event and NO job ever executes them: the only other job that
      # installs torch is the weekly one in scheduled.yml, and it runs `-m model`, which
      # deselects them.
      - name: Install with optional backends + CPU torch
        run: >
          uv sync --locked --extra ot --extra cluster-graph --extra pacmap
          --extra explain --group torch-cpu

      # Same suite: the ot/leiden/pacmap/shap and torch tests un-skip themselves when the
      # backend is importable, so this job covers the optional code paths.
      # --cov-fail-under=0: the floor is the torch-free contract, enforced in the
      # `coverage` job only; here we collect data, we do not gate.
      - name: Tests (optional backends + torch)
        env:
          COVERAGE_FILE: coverage-data-extras
        run: uv run pytest --cov --cov-report= --cov-fail-under=0

      - name: Upload coverage data (extras + torch)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-extras
          path: coverage-data-extras
          if-no-files-found: error

  # Conventional-commit gate: every commit in a PR must parse.
  commits:
    name: conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          version: ${{ env.UV_VERSION }}
      - name: Check commit messages
        run: >
          uvx --from commitizen==4.18.0 cz check
          --rev-range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  # Developer Certificate of Origin: every commit in a PR must carry a
  # `Signed-off-by:` trailer matching its author email (added by `git commit -s`).
  # Self-contained on purpose — no third-party action to pin or audit. DCO is a
  # human-contributor attestation, so bot-authored PRs (release-please's release
  # PR, Renovate) are exempt — their automated commits carry no sign-off, and a
  # skipped job is tolerated by the `CI success` gate.
  dco:
    name: DCO sign-off
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify Signed-off-by on every commit
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for sha in $(git rev-list --no-merges "$BASE".."$HEAD"); do
            email="$(git show -s --format='%ae' "$sha")"
            subject="$(git show -s --format='%s' "$sha")"
            # Collect emails from every Signed-off-by trailer, then match the
            # author's exactly (grep -xF avoids treating '+'/'.' as regex).
            signoffs="$(git show -s --format='%B' "$sha" \
              | grep -iE '^Signed-off-by:' \
              | sed -E 's/.*<(.*)>.*/\1/')"
            if ! printf '%s\n' "$signoffs" | grep -qxF "$email"; then
              echo "::error::commit ${sha} (\"${subject}\") has no Signed-off-by for <${email}>"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::DCO check failed — sign commits with 'git commit -s' (or 'git rebase --signoff ${BASE}')."
            exit 1
          fi

  # Single required status check for branch protection: collapses the whole
  # matrix + every gate into one context, so protection never has to enumerate
  # individual job names (which change with the matrix). Fails if any required
  # job failed or was cancelled; PR-only jobs (commits, dco) report "skipped" on
  # push-to-main and are tolerated. The real-model and benchmark suites live in
  # scheduled.yml — too slow to gate a PR, and deliberately not part of this gate.
  ci-success:
    name: CI success
    if: always()
    needs: [test, static, coverage, sonarqube, test-lowest, test-extras, commits, dco]
    runs-on: ubuntu-latest
    steps:
      # Fail closed. The previous form guarded the failing step with
      # `contains(needs.*.result, 'failure')`, so the gate passed by default and only
      # failed when that expression fired — and it did not always fire. Observed on
      # run 32050745798: a matrix leg died in "Set up job", the run concluded
      # `failure`, yet this guard was reported as `skipped` and the one context branch
      # protection requires went green over a red run. Asserting the accepted results
      # instead means an unrecognised or missing result fails the gate rather than
      # slipping through it. `skipped` is accepted on purpose: the PR-only gates
      # (commits, dco) legitimately skip on push-to-main, sonarqube skips on fork
      # PRs, and the slow suites live in scheduled.yml, outside this workflow entirely.
      # Dumping the whole context makes the next anomaly diagnosable from the log instead of
      # by re-deriving it from check-run timestamps.
      - name: Verify every required job succeeded
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS"
          bad="$(printf '%s' "$NEEDS" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key)=\(.value.result)"')"
          if [ -n "$bad" ]; then
            echo "::error::required job(s) did not succeed: $(printf '%s' "$bad" | tr '\n' ' ')"
            exit 1
          fi
          echo "every required job succeeded or was legitimately skipped"
